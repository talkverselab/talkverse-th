name: thai_universe
description: "태국어유니버스 — 한국 화자 태국어(방콕) 학습 앱"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.2
  # Talkverse ID(auth.talkverse.uk) — lib/data/account.dart · purchase.dart (한자 앱과 같은 공용 클라이언트)
  http: ^1.6.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.16
  path_provider: ^2.1.4

  # Util
  csv: ^6.0.0
  package_info_plus: ^10.2.2
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.0

  # Drift (SQLite ORM)
  drift: ^2.20.3
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.20.3
  build_runner: ^2.4.13


flutter:
  uses-material-design: true

  fonts:
    # 태국어 글꼴 선택(lib/core/thai_font.dart) — Grok 추천 3종(2026-11-02), 모두 OFL(assets/fonts/OFL_*.txt)
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-SemiBold.ttf
          weight: 600
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 600
    - family: BaiJamjuree
      fonts:
        - asset: assets/fonts/BaiJamjuree-Regular.ttf
        - asset: assets/fonts/BaiJamjuree-SemiBold.ttf
          weight: 600

  assets:
    - assets/data/alphabet/
    - assets/data/tones/
    - assets/data/dialogues/
    - assets/data/wordsets/
    - assets/data/grammar/
    - assets/data/phrases/
    - assets/data/vocab/
    - assets/data/course/
    - assets/data/content_manifest.json
    - assets/data/version.json
    - assets/audio/
    - assets/images/
    - assets/images/ipa/
