name: thai_universe
description: "태국어유니버스 — 한국 화자 태국어(방콕) 학습 앱"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.2
  # Talkverse ID(auth.talkverse.uk) — lib/data/account.dart · purchase.dart (한자 앱과 같은 공용 클라이언트)
  http: ^1.6.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.16
  path_provider: ^2.1.4
  video_player: ^2.14.1  # 언어감각 회차 영상(일본어앱과 같은 판, 2026-11-19)

  # Util
  csv: ^6.0.0
  package_info_plus: ^10.2.2
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.0

  # Drift (SQLite ORM)
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  speech_to_text: ^7.4.0
  record: ^6.2.1   # 성조연습 녹음(16kHz PCM) — 중국어앱과 같은 판
  talkverse_pitch:   # 음높이 추적·곡선 비교 모듈(uk 담당 원본 ~/talkverse/talkverse-pitch 복사본 — 고치지 말 것)
    path: packages/talkverse_pitch
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.33.0
  build_runner: ^2.15.0


flutter:
  uses-material-design: true

  fonts:
    # 태국어 글꼴 선택(lib/core/thai_font.dart) — Grok 추천 3종(2026-11-02), 모두 OFL(assets/fonts/OFL_*.txt)
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-SemiBold.ttf
          weight: 600
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 600
    - family: BaiJamjuree
      fonts:
        - asset: assets/fonts/BaiJamjuree-Regular.ttf
        - asset: assets/fonts/BaiJamjuree-SemiBold.ttf
          weight: 600

  assets:
    - assets/curriculum_th.json   # 토크버스 커리큘럼 단계 기본값(서버 rev 가 높으면 받아 바꿈, CURRICULUM_SPEC §12)
    - assets/data/alphabet/
    - assets/data/tones/
    - assets/data/tone_drill.json   # 성조연습 자료(tools/build_tone_drill.py)
    - assets/data/dialogues/
    # 하위 폴더는 따로 적어야 번들에 들어간다(2026-11-19 확인 — 빠져 있었음)
    - assets/data/dialogues/R0/culture/
    - assets/data/dialogues/R0/friends/
    - assets/data/dialogues/R0/life/
    - assets/data/dialogues/R0/love/
    - assets/data/dialogues/R0/study/
    - assets/data/dialogues/R0/survival/
    - assets/data/dialogues/R0/travel/
    - assets/data/dialogues/R0/work/
    - assets/data/dialogues/R1/culture/
    - assets/data/dialogues/R1/friends/
    - assets/data/dialogues/R1/life/
    - assets/data/dialogues/R1/love/
    - assets/data/dialogues/R1/study/
    - assets/data/dialogues/R1/survival/
    - assets/data/dialogues/R1/travel/
    - assets/data/dialogues/R1/work/
    - assets/data/dialogues/R2/culture/
    - assets/data/dialogues/R2/friends/
    - assets/data/dialogues/R2/life/
    - assets/data/dialogues/R2/love/
    - assets/data/dialogues/R2/study/
    - assets/data/dialogues/R2/survival/
    - assets/data/dialogues/R2/travel/
    - assets/data/dialogues/R2/work/
    - assets/data/dialogues/R3/culture/
    - assets/data/dialogues/R3/friends/
    - assets/data/dialogues/R3/life/
    - assets/data/dialogues/R3/love/
    - assets/data/dialogues/R3/study/
    - assets/data/dialogues/R3/travel/
    - assets/data/dialogues/R3/work/
