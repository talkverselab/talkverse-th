name: thai_universe
description: "태국어유니버스 — 한국 화자 태국어(방콕) 학습 앱"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Util
  csv: ^6.0.0
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.0

  # Drift (SQLite ORM)
  drift: ^2.20.3
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

  # Launcher icons
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon_full.png"
  adaptive_icon_background: "#E6007E"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/data/alphabet/
    - assets/data/tones/
    - assets/data/dialogues/
    - assets/data/wordsets/
    - assets/data/chunks/
    - assets/data/grammar/
    - assets/data/phrases/
    - assets/audio/
    - assets/images/
