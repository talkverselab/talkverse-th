name: iOS TestFlight

# master 푸시(앱 코드 변경) → GitHub macOS 러너에서 서명 → App Store Connect(TestFlight) 업로드.
# 켜는 스위치: 리포 Variables 에 IOS_TESTFLIGHT_ENABLED=true
# 필요한 시크릿 (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID            App Store Connect API 키 ID
#   ASC_ISSUER_ID         App Store Connect Issuer ID
#   ASC_KEY_P8_BASE64     .p8 키 파일 내용을 base64 로
#   IOS_DIST_P12_BASE64   Apple Distribution 인증서(+개인키) .p12 를 base64 로
#   IOS_DIST_P12_PASSWORD .p12 비밀번호
#   APPLE_TEAM_ID         팀 ID (10자)
on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    if: ${{ vars.IOS_TESTFLIGHT_ENABLED == 'true' }}
    env:
      BUNDLE_ID: com.talkverse.thaiUniverse
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 1) 배포 인증서를 임시 키체인에
      - name: Import distribution certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PW=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import $RUNNER_TEMP/dist.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # 2) API 키 파일 (altool / fastlane 공용)
      - name: Write App Store Connect API key
        env:
          P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          python3 - <<'PY'
          import json, os
          key = open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{os.environ['ASC_KEY_ID']}.p8")).read()
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": key, "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "asc_key.json"), "w"))
          PY

      # 3) App Store 프로비저닝 프로파일 발급·설치 (fastlane sigh, API 키 인증)
      - name: Provisioning profile
        run: |
          fastlane run get_provisioning_profiles \
            api_key_path:"$RUNNER_TEMP/asc_key.json" \
            app_identifier:"$BUNDLE_ID" team_id:"$APPLE_TEAM_ID" \
            output_path:"$RUNNER_TEMP/profiles" filename:"appstore.mobileprovision" \
            readonly:false skip_certificate_verification:true
          PROFILE="$RUNNER_TEMP/profiles/appstore.mobileprovision"
          NAME=$(security cms -D -i "$PROFILE" | plutil -extract Name raw -o - -)
          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "profile: $NAME ($UUID)"

      - name: Export options
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF

      # 4) 빌드 · 아카이브 · 수동 서명 (FLUTTER_XCODE_* 환경변수가 Xcode 빌드 설정으로 들어간다)
      - name: Build signed IPA
        env:
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: Apple Distribution
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ${{ env.PROFILE_NAME }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          flutter build ipa --release \
            --build-name="$VER" --build-number=${{ github.run_number }} \
            --export-options-plist=$RUNNER_TEMP/ExportOptions.plist 2>&1 | tail -40
          ls -la build/ios/ipa/

      # 5) TestFlight 업로드
      - name: Upload to TestFlight
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thai-universe-ios-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 14
