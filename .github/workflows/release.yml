name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get

      - run: flutter test

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk thai-universe-latest.apk

      - name: Update rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 태국어유니버스 — 최신 빌드
          body: |
            master 푸시마다 자동 갱신되는 서명된 릴리스 APK.
            폰에서 이 페이지를 열고 `thai-universe-latest.apk`를 받아 설치하세요.
          make_latest: true
          files: thai-universe-latest.apk
